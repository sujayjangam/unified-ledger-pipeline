name: Postgres backup to GCS

on:
  schedule:
    - cron: '0 */6 * * *'   # 00:00, 06:00, 12:00, 18:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write   # required to mint the WIF OIDC token

env:
  GCP_PROJECT_ID: project-25d90722-14a9-4eca-8a0
  GCS_BUCKET: unified-ledger-pg-backups-458614017842
  WIF_PROVIDER: projects/458614017842/locations/global/workloadIdentityPools/github-actions-pool/providers/github-actions-provider
  WIF_SERVICE_ACCOUNT: pg-backup-runner@project-25d90722-14a9-4eca-8a0.iam.gserviceaccount.com

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Authenticate to GCP (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Install pg_dump (pinned to Neon's actual Postgres major version, not "latest")
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.pub \
            --fail https://www.postgresql.org/media/keys/ACCC4CF8.asc
          sudo sh -c 'echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.pub] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            > /etc/apt/sources.list.d/pgdg.list'
          sudo apt-get update

          # Pinned to 18, not the unversioned "latest" package: Neon's actual server version is
          # 18.4, confirmed 2026-08-12 from a local pg_dump's own archive header ("Dumped from
          # database version: 18.4"), not assumed. "Latest" would drift silently across runs as
          # PGDG publishes new majors, with nothing in this file recording what's actually being
          # used or why it's safe. If Neon's project is ever upgraded to a new major version
          # (a deliberate, rare, user-initiated action — not something Neon does silently),
          # update this pin (and the PG_BIN_DIR fallback below) alongside that upgrade.
          sudo apt-get install -y postgresql-client-18

          # ubuntu-latest runners ship an older pg_dump on PATH already (16.14, from Ubuntu's
          # own noble repo, confirmed via a live run) which the apt-get above does not override.
          # The PGDG-installed binary must be found explicitly and put ahead of PATH for every
          # later step in this job (GITHUB_PATH additions apply starting next step, not this one).
          PG_BIN_DIR="$(ls -d /usr/lib/postgresql/*/bin | sort -V | tail -1)"
          echo "$PG_BIN_DIR" >> "$GITHUB_PATH"
          "$PG_BIN_DIR/pg_dump" --version

      - name: Dump database and upload to GCS
        id: backup
        run: |
          set -euo pipefail
          DB_URL="$(gcloud secrets versions access latest --secret=DATABASE_URL --project="${GCP_PROJECT_ID}")"
          if [ -z "$DB_URL" ]; then
            echo "::error::DATABASE_URL secret returned empty"
            exit 1
          fi
          echo "::add-mask::${DB_URL}"

          # libpq (which pg_dump uses) doesn't understand the +psycopg SQLAlchemy dialect
          # suffix used elsewhere in this repo (app/database.py needs it, pg_dump does not).
          # Passing it unmodified causes libpq to mis-parse the DSN — a first live run showed
          # this can make libpq reconstruct connection details in its error message in a form
          # that doesn't byte-match the masked string above, leaking host/db info into a public
          # log even with ::add-mask:: registered. Mask the corrected form too, defensively.
          DB_URL="${DB_URL/postgresql+psycopg:\/\//postgresql:\/\/}"
          echo "::add-mask::${DB_URL}"

          TIMESTAMP="$(date -u +%Y%m%dT%H%M%SZ)"
          DUMP_FILE="/tmp/ulp-backup-${TIMESTAMP}.dump"
          OBJECT_PATH="gs://${GCS_BUCKET}/backups/${TIMESTAMP}.dump"

          # pg_dump's raw stderr is never echoed to the log, even on failure: masking is
          # substring-based and only catches text that byte-matches a registered secret, so any
          # future reformatting quirk (in libpq or elsewhere) could leak connection details the
          # same way the scheme bug above did. Capture to a file that never leaves the runner.
          set +e
          pg_dump -Fc --no-owner --no-privileges -d "$DB_URL" -f "$DUMP_FILE" 2>/tmp/pg_dump_stderr.log
          PG_DUMP_EXIT=$?
          set -e
          unset DB_URL
          if [ "$PG_DUMP_EXIT" -ne 0 ]; then
            echo "::error::pg_dump failed with exit code ${PG_DUMP_EXIT}. Raw error withheld from this public log — re-run locally against the same DATABASE_URL secret to see the full message."
            exit 1
          fi

          DUMP_SIZE=$(stat -c%s "$DUMP_FILE")
          echo "Dump size: ${DUMP_SIZE} bytes"
          if [ "$DUMP_SIZE" -lt 1024 ]; then
            echo "::error::Dump file suspiciously small (${DUMP_SIZE} bytes) — refusing to upload"
            exit 1
          fi

          gcloud storage cp "$DUMP_FILE" "$OBJECT_PATH"
          rm -f "$DUMP_FILE"

          echo "object_path=${OBJECT_PATH}" >> "$GITHUB_OUTPUT"   # path only — never the DB URL

      - name: Verify object landed in GCS
        run: |
          set -euo pipefail
          gcloud storage objects describe "${{ steps.backup.outputs.object_path }}" \
            --format="default(name,size,timeCreated)"
